# Granite 4.0-H Tiny (7B total, ~1B active) Configuration
# ibm-granite/granite-4.0-h-tiny - Mixed Mamba/Attention MoE architecture

model_id: "ibm-granite/granite-4.0-h-tiny"

# Output directory for sharded model
output_dir: "./output/granite-tiny-q4g64"

# Layer grouping for distributed inference
# Granite-tiny has 40 layers (36 mamba, 4 attention)
# Attention layers are at indices: 5, 15, 25, 35
layer_groups:
  - [0, 9]    # Layers 0-9: mostly mamba (attn at 5)
  - [10, 19]  # Layers 10-19: mostly mamba (attn at 15)
  - [20, 29]  # Layers 20-29: mostly mamba (attn at 25)
  - [30, 39]  # Layers 30-39: mostly mamba (attn at 35)

# Quantization settings
quantize: true
quant_bits: 4         # INT4 quantization for ~4x compression
quant_group_size: 64  # Group-wise INT4 (CRITICAL: per-tensor would collapse accuracy)
dtype: float16

# Model loading settings
trust_remote_code: false

# Metadata
metadata:
  name: "Granite 4.0-H Tiny"
  description: "Granite MoE Hybrid optimized for distributed inference"
  context_length: 131072
  architecture: "granitemoehybrid"
  parameters: "7B total / ~1B active"
  recommended_for: "development, testing, demos"